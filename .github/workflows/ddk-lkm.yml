name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      manager_package:
        description: 'Manager package name accepted by the kernel module'
        required: false
        default: 'com.mimi0721.manager'
        type: string
      expected_size:
        description: 'Primary manager signing certificate size'
        required: false
        default: '0x02c8'
        type: string
      expected_hash:
        description: 'Primary manager signing certificate SHA-256'
        required: false
        default: '3b0d042b55e4eee9eb14c9aedbbe1499dacea8eb4c87106a2c5b922e7c2583af'
        type: string
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build kernelsu.ko
      env:
        MANAGER_PACKAGE: ${{ inputs.manager_package }}
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
        EXPECTED_SIZE2: ${{ inputs.expected_size2 }}
        EXPECTED_HASH2: ${{ inputs.expected_hash2 }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        if [ -z "$MANAGER_PACKAGE" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_HASH" ]; then
          echo "ERROR: manager_package, expected_size, and expected_hash must be provided."
          exit 1
        fi
        BASE_ARGS="KSU_MANAGER_PACKAGE=$MANAGER_PACKAGE KSU_EXPECTED_SIZE=$EXPECTED_SIZE KSU_EXPECTED_HASH=$EXPECTED_HASH"
        EXTRA_ARGS=""
        if [ -n "$EXPECTED_SIZE2" ] && [ -z "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_hash2 must be provided when expected_size2 is set."
          exit 1
        fi
        if [ -z "$EXPECTED_SIZE2" ] && [ -n "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_size2 must be provided when expected_hash2 is set."
          exit 1
        fi
        if [ -n "$EXPECTED_SIZE2" ]; then
          EXTRA_ARGS="KSU_EXPECTED_SIZE2=$EXPECTED_SIZE2 KSU_EXPECTED_HASH2=$EXPECTED_HASH2"
        fi
        CONFIG_KSU=m CC=clang make $BASE_ARGS $EXTRA_ARGS

        # KernelSU-owned symbols must resolve inside the module, not on the device.
        llvm-nm --undefined-only ksu.ko > /tmp/ksu-undefined-symbols.txt
        if grep -E '[[:space:]](ksu_|kernelsu_|tiny_sulog_|write_sulog$|send_sulog_dump$)' /tmp/ksu-undefined-symbols.txt; then
          echo "ERROR: kernelsu.ko contains unresolved KernelSU symbols."
          exit 1
        fi

        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/aarch64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp ksu.ko "$OUT_DIR/$OUTPUT_NAME"

        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"

    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: aarch64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/aarch64/${{ inputs.kmi }}_kernelsu.ko
