name: Build XX-branch LKM for KernelSU
on:
  workflow_call:
    inputs:
      manager_package:
        description: 'Manager package name accepted by the kernel module'
        required: false
        default: 'com.mimi0721.manager'
        type: string
      expected_size:
        description: 'Primary manager signing certificate size'
        required: false
        default: '0x02c8'
        type: string
      expected_hash:
        description: 'Primary manager signing certificate SHA-256'
        required: false
        default: '3b0d042b55e4eee9eb14c9aedbbe1499dacea8eb4c87106a2c5b922e7c2583af'
        type: string
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string
  workflow_dispatch:
jobs:
  checkout-and-build:
    name: Build ${{ matrix.kmi }} from xx branch
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get MISU version
      id: version
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cd kernel
        KSU_VERSION=$(sed -n 's/.*-DKSU_VERSION=\([0-9][0-9]*\).*/\1/p' Makefile | head -n1)
        if [ -z "$KSU_VERSION" ]; then
          KSU_GIT_VERSION=$(git rev-list --count HEAD)
          KSU_VERSION=$((30000 + KSU_GIT_VERSION - 97))
        fi
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_OUTPUT
        echo "Calculated KSU_VERSION: $KSU_VERSION"

    - name: Fetch and checkout xxKSU
      run: |
        git remote add xx https://github.com/backslashxx/KernelSU
        git fetch xx master
        git checkout xx/master

        sed -i "s/CFLAGS_ksu.o += -DKSU_VERSION=.*/CFLAGS_ksu.o += -DKSU_VERSION=${{ steps.version.outputs.KSU_VERSION }}/" kernel/Makefile

    - name: Build kernelsu.ko
      env:
        MANAGER_PACKAGE: ${{ inputs.manager_package }}
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
        EXPECTED_SIZE2: ${{ inputs.expected_size2 }}
        EXPECTED_HASH2: ${{ inputs.expected_hash2 }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ matrix.kmi }} from xx branch ==="

        if [ -z "$MANAGER_PACKAGE" ] || [ -z "$EXPECTED_SIZE" ] || [ -z "$EXPECTED_HASH" ]; then
          echo "ERROR: manager_package, expected_size, and expected_hash must be provided."
          exit 1
        fi
        BASE_ARGS="KSU_MANAGER_PACKAGE=$MANAGER_PACKAGE KSU_EXPECTED_SIZE=$EXPECTED_SIZE KSU_EXPECTED_HASH=$EXPECTED_HASH"
        EXTRA_ARGS=""
        if [ -n "$EXPECTED_SIZE2" ] && [ -z "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_hash2 must be provided when expected_size2 is set."
          exit 1
        fi
        if [ -z "$EXPECTED_SIZE2" ] && [ -n "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_size2 must be provided when expected_hash2 is set."
          exit 1
        fi
        if [ -n "$EXPECTED_SIZE2" ]; then
          EXTRA_ARGS="KSU_EXPECTED_SIZE2=$EXPECTED_SIZE2 KSU_EXPECTED_HASH2=$EXPECTED_HASH2"
        fi
        CONFIG_KSU=m CC=clang make $BASE_ARGS $EXTRA_ARGS

        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        mkdir -p /github/workspace/out

        # Copy with xx- prefix and KMI-specific naming
        OUTPUT_NAME="xx-${{ matrix.kmi }}_kernelsu.ko"
        cp ksu.ko "/github/workspace/out/$OUTPUT_NAME"

        echo "Copied to: /github/workspace/out/$OUTPUT_NAME"
        ls -la "/github/workspace/out/$OUTPUT_NAME"
        echo "Size: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "/github/workspace/out/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"

    - name: Upload xx-kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: xx-${{ matrix.kmi }}-lkm
        path: /github/workspace/out/xx-${{ matrix.kmi }}_kernelsu.ko
